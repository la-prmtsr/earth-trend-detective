<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth Trend Detective — Earth System Case Files</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 28 28%22%3E%3Ccircle cx=%2214%22 cy=%2214%22 r=%2211%22 fill=%22none%22 stroke=%22%2318181B%22 stroke-width=%222%22/%3E%3Ccircle cx=%2219.5%22 cy=%229%22 r=%223%22 fill=%22%232F6B4F%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/plotly-basic.min.js"></script>
  <script src="/static/vendor/lucide.min.js"></script>
  <script src="/static/vendor/d3-array.min.js"></script>
  <script src="/static/vendor/d3-geo.min.js"></script>
  <script src="/static/earth-land.js"></script>
  <script src="/static/ui.js"></script>
  <script src="/static/app.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body x-data="trendApp()" x-init="init()" :data-theme="themeKey()" :data-tab="tab">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 28 28" width="28" height="28" aria-hidden="true">
          <circle cx="14" cy="14" r="11" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3.5 14h21M14 3c3 3.2 4.5 6.8 4.5 11S17 21.8 14 25" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".45"/>
          <circle cx="19.5" cy="9" r="2.6" class="brand-dot"/>
        </svg>
        <div>
          <div class="brand-title">Earth Trend Detective</div>
          <div class="brand-sub" x-text="t('brandSub')"></div>
        </div>
      </div>

      <nav class="seg nav" role="tablist" aria-label="Case navigation">
        <template x-for="item in tabs" :key="item.id">
          <button role="tab" :aria-selected="tab === item.id" :class="{ active: tab === item.id }" @click="go(item.id)">
            <span class="ico" x-html="icon(item.icon, 15)"></span>
            <span x-text="t('tab_' + item.id)"></span>
          </button>
        </template>
      </nav>

      <div class="seg seg-sm lang" role="group" aria-label="Language">
        <button type="button" :class="{ active: lang === 'en' }" @click="setLang('en')">EN</button>
        <button type="button" :class="{ active: lang === 'tr' }" @click="setLang('tr')">TR</button>
      </div>
    </div>
  </header>

  <section class="hero" x-cloak x-effect="earthFocus($data)">
    <canvas class="earth" x-init="earthInit($el)" aria-hidden="true"></canvas>
    <div class="hero-veil" aria-hidden="true"></div>
    <div class="wrap hero-wrap">
      <template x-for="k in [tab]" :key="k">
        <div class="hero-in">
          <div class="case-meta">
            <span class="kicker"><i></i><span x-text="heroMeta().kicker"></span></span>
            <span class="coords"><span x-html="icon('crosshair', 13)"></span><span x-text="regionBadge()"></span></span>
          </div>
          <h1 x-text="heroMeta().headline"></h1>
          <p class="case-desc" x-text="heroMeta().desc"></p>
          <div class="sensors">
            <span class="sensors-label" x-text="t('sensorsLabel')"></span>
            <template x-for="s in heroMeta().sensorNote.split(' · ')" :key="s">
              <span class="sensor" x-text="s"></span>
            </template>
          </div>
        </div>
      </template>

      <!-- Explore tab: facts are skipped because they repeat the 3 questions below -->
      <div class="facts" x-show="tab !== 'explore'">
        <template x-for="(k, idx) in heroKpis()" :key="tab + idx">
          <div class="fact" :style="'--i:' + idx">
            <div class="fact-label" x-text="k.label"></div>
            <div class="fact-value" x-effect="countUp($el, k.value)"></div>
            <div class="fact-foot" x-text="k.foot"></div>
          </div>
        </template>
      </div>
    </div>

  </section>

  <main class="wrap" x-cloak>

    <!-- CASE 1 & CASE 2 -->
    <template x-if="tab === 'case1' || tab === 'case2'">
      <div>
        <section class="section">
          <div class="section-head">
            <h2><span x-text="t('suspectTitle')"></span> <span class="section-sub" x-text="'— ' + t('suspectSub')"></span></h2>
            <span class="note"><span x-html="icon('shield-check', 14)"></span><span x-text="t('fdrNote')"></span></span>
          </div>

          <template x-if="caseData[tab]?.missing?.length">
            <div class="warn">
              <span x-html="icon('triangle-alert', 16)"></span>
              <div>
                <strong x-text="t('missingTitle')"></strong>
                <span x-text="caseData[tab].missing.join(', ')"></span>
                <span x-text="t('missingHint')"></span>
              </div>
            </div>
          </template>

          <template x-if="loading">
            <div class="loading"><span class="spinner"></span><span x-text="t('loadingRecords')"></span></div>
          </template>

          <div class="board" x-show="!loading && (caseData[tab]?.variables || []).length">
            <div class="board-head">
              <span></span>
              <span x-text="t('colVar')"></span>
              <span x-text="t('colShape')"></span>
              <span x-text="t('colTrend')"></span>
              <span>p</span>
              <span x-text="t('colRecord')"></span>
              <span x-text="t('colDetect')"></span>
              <span x-text="t('colStatus')"></span>
              <span></span>
            </div>
            <template x-for="(v, i) in (caseData[tab]?.variables || [])" :key="tab + v.id">
              <button class="board-row" :style="'--i:' + i" @click="open(v)">
                <span class="br-ico tile" :class="topicClass(v.id)" x-html="icon(varIcon(v.id), 17)"></span>
                <span class="br-name">
                  <strong x-text="varName(v)"></strong>
                  <small x-text="v.source"></small>
                </span>
                <span class="br-spark" x-html="spark(v)"></span>
                <span class="num br-rate" :class="v.significant ? 'sig' : ''" x-text="perDecade(v)"></span>
                <span class="num br-p" x-text="fmtP(v.p_final)"></span>
                <span class="num br-yrs" x-text="v.stats.years + ' ' + t('yrsUnit')"></span>
                <span class="br-detect" x-text="detectText(v)"></span>
                <span class="br-meta-m num" x-text="'p ' + fmtP(v.p_final) + ' · ' + v.stats.years + ' ' + t('yrsUnit') + ' · ' + detectText(v)"></span>
                <span class="status" :class="v.significant ? 'sig' : 'unc'"><i></i><span x-text="v.significant ? t('sigPill') : t('uncPill')"></span></span>
                <span class="br-chev" x-html="icon('chevron-right', 16)"></span>
              </button>
            </template>
          </div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2 x-text="t('flowTitle')"></h2>
          </div>
          <p class="method-desc" x-text="t('flowDesc')"></p>
          <ol class="steps">
            <li class="step"><span class="step-ico" x-html="icon('satellite', 16)"></span><div class="step-t" x-text="t('step1Title')"></div><div class="step-d" x-text="t('step1Desc')"></div></li>
            <li class="step"><span class="step-ico" x-html="icon('calendar-range', 16)"></span><div class="step-t" x-text="t('step2Title')"></div><div class="step-d" x-text="t('step2Desc')"></div></li>
            <li class="step"><span class="step-ico" x-html="icon('trending-up', 16)"></span><div class="step-t" x-text="t('step3Title')"></div><div class="step-d" x-text="t('step3Desc')"></div></li>
            <li class="step"><span class="step-ico" x-html="icon('hourglass', 16)"></span><div class="step-t" x-text="t('step4Title')"></div><div class="step-d" x-text="t('step4Desc')"></div></li>
          </ol>
        </section>
      </div>
    </template>

    <!-- CASE 3: TWO REGIONS -->
    <template x-if="tab === 'compare'">
      <div>
        <section class="section">
          <div class="panel">
            <div class="field">
              <label class="label" x-text="t('cmpStep1')"></label>
              <div class="chips">
                <template x-for="v in liveVars()" :key="v.id">
                  <button class="chip" :class="{ on: cmp.var === v.id }" @click="cmp.var = v.id">
                    <span x-html="icon(varIcon(v.id), 15)"></span>
                    <span x-text="varName(v)"></span>
                  </button>
                </template>
              </div>
            </div>

            <div class="grid2 field">
              <div>
                <label class="label" x-text="t('cmpStep2')"></label>
                <select class="input" x-model="cmp.a">
                  <template x-for="(p, k) in places" :key="k">
                    <option :value="k" x-text="p.name" :selected="k === cmp.a"></option>
                  </template>
                </select>
              </div>
              <div>
                <label class="label" x-text="t('cmpStep3')"></label>
                <select class="input" x-model="cmp.b">
                  <template x-for="(p, k) in places" :key="k">
                    <option :value="k" x-text="p.name" :selected="k === cmp.b"></option>
                  </template>
                </select>
              </div>
            </div>

            <div class="actions">
              <button class="btn" @click="compare()" :disabled="busy">
                <span x-show="busy" class="spinner light"></span>
                <span x-show="!busy" x-html="icon('arrow-left-right', 16)"></span>
                <span x-text="busy ? t('fetchingPower') : t('compareBtn')"></span>
              </button>
            </div>
            <p class="error" x-show="error" x-text="error"></p>
          </div>
        </section>

        <section class="section grid2 results" :class="{ empty: !cmp.results.length }">
          <template x-for="(r, i) in cmp.results" :key="i">
            <article class="panel result">
              <div class="r-head">
                <span class="r-place"><span x-html="icon('map-pin', 15)"></span><span x-text="places[i === 0 ? cmp.a : cmp.b]?.name"></span></span>
                <span class="status" :class="r.significant ? 'sig' : 'unc'"><i></i><span x-text="r.significant ? t('sigShort') : t('uncShort')"></span></span>
              </div>
              <div class="r-rate num" x-text="perDecade(r)"></div>
              <div class="chart" :id="'cmp-chart-' + i"></div>
              <p class="r-exp" x-text="r.explanation"></p>
              <button class="link" @click="open(r)">
                <span x-text="t('inspectProof')"></span>
                <span x-html="icon('chevron-right', 15)"></span>
              </button>
            </article>
          </template>
        </section>
      </div>
    </template>

    <!-- EXPLORE -->
    <template x-if="tab === 'explore'">
      <div>
        <section class="section">
          <div class="panel">
            <div class="field">
              <label class="label"><span class="n">1</span><span x-text="t('exQ1')"></span></label>
              <div class="chips">
                <template x-for="(name, k) in catalog.topics" :key="k">
                  <button class="chip" :class="{ on: ex.topic === k }" @click="ex.topic = k">
                    <span x-html="icon(topicIcon(k), 15)"></span>
                    <span x-text="topicName(k, name)"></span>
                  </button>
                </template>
              </div>
            </div>

            <div class="field">
              <label class="label"><span class="n">2</span><span x-text="t('exQ2')"></span></label>
              <div class="chips">
                <template x-for="(p, k) in places" :key="k">
                  <button class="chip" :class="{ on: ex.place === k }" @click="pickPlace(k)">
                    <span x-html="icon('map-pin', 15)"></span>
                    <span x-text="p.name"></span>
                  </button>
                </template>
                <button class="chip" :class="{ on: ex.place === 'custom' }" @click="ex.place = 'custom'">
                  <span x-html="icon('compass', 15)"></span>
                  <span x-text="t('customCoords')"></span>
                </button>
              </div>
              <div class="grid2 coords-row" x-show="ex.place === 'custom'">
                <div>
                  <label class="label sub" x-text="t('latLabel')"></label>
                  <input class="input" type="number" step="0.01" x-model.number="ex.lat">
                </div>
                <div>
                  <label class="label sub" x-text="t('lonLabel')"></label>
                  <input class="input" type="number" step="0.01" x-model.number="ex.lon">
                </div>
              </div>
            </div>

            <div class="field">
              <label class="label"><span class="n">3</span><span x-text="t('exQ3')"></span></label>
              <div class="chips">
                <template x-for="(name, k) in catalog.place_types" :key="k">
                  <button class="chip" :class="{ on: ex.type === k }" @click="ex.type = k">
                    <span x-html="icon(placeIcon(k), 15)"></span>
                    <span x-text="placeTypeName(k, name)"></span>
                  </button>
                </template>
              </div>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2><span x-text="t('suggestedTitle')"></span> <span class="section-sub" x-text="'— ' + t('suggestedSub')"></span></h2>
          </div>
          <div class="list">
            <template x-for="v in suggestions()" :key="v.id">
              <div class="list-row">
                <span class="br-ico tile" :class="topicClass(v.id)" x-html="icon(varIcon(v.id), 17)"></span>
                <div class="lr-text">
                  <strong x-text="varName(v)"></strong>
                  <small x-text="v.definition"></small>
                </div>
                <template x-if="v.power_param">
                  <button class="btn sm" @click="analyzeLive(v.id)" :disabled="busy">
                    <span x-text="busy ? t('analyzing') : t('analyzeLive')"></span>
                  </button>
                </template>
                <template x-if="!v.power_param">
                  <span class="tag" x-text="t('inCaseFiles')"></span>
                </template>
              </div>
            </template>
            <template x-if="!suggestions().length">
              <div class="list-row empty" x-text="t('noMatch')"></div>
            </template>
          </div>
          <p class="error" x-show="error" x-text="error"></p>
        </section>
      </div>
    </template>

    <footer class="footer">
      <span x-text="t('footerText')"></span>
    </footer>
  </main>

  <!-- DETAIL SHEET -->
  <div class="backdrop" x-show="sheet" x-cloak x-transition.opacity @click="sheet = null"></div>
  <aside class="sheet" x-show="sheet" x-cloak x-transition:enter="sheet-in" x-transition:leave="sheet-out" @keydown.escape.window="sheet = null" role="dialog" aria-modal="true">
    <template x-if="sheet">
      <div class="sheet-inner">
        <div class="grabber"></div>

        <div class="sh-head">
          <span class="sh-ico tile" :class="topicClass(sheet.id)" x-html="icon(varIcon(sheet.id), 20)"></span>
          <div class="sh-titles">
            <h2 x-text="varName(sheet)"></h2>
            <small x-text="sheet.source"></small>
          </div>
          <button class="close" @click="sheet = null" aria-label="Close" x-html="icon('x', 18)"></button>
        </div>

        <p class="def" x-text="sheet.definition"></p>

        <div class="chart big" id="sheet-chart"></div>

        <p class="guide"><strong x-text="t('quickGuideLabel')"></strong> <span x-text="t('quickGuideText')"></span></p>

        <div class="metrics">
          <div class="metric">
            <span class="m-label" x-text="t('m1Label')"></span>
            <strong class="m-val" x-text="perDecade(sheet)"></strong>
            <p class="m-help" x-text="metricHelp(sheet, 'trend')"></p>
          </div>
          <div class="metric">
            <span class="m-label" x-text="t('m2Label')"></span>
            <strong class="m-val" x-text="range(sheet)"></strong>
            <p class="m-help" x-text="metricHelp(sheet, 'range')"></p>
          </div>
          <div class="metric">
            <span class="m-label" x-text="t('m3Label')"></span>
            <strong class="m-val" x-text="fmtP(sheet.p_final)"></strong>
            <p class="m-help" x-text="metricHelp(sheet, 'pvalue')"></p>
          </div>
          <div class="metric">
            <span class="m-label" x-text="t('m4Label')"></span>
            <strong class="m-val" x-text="sheet.stats.years + ' ' + t('yrsUnit')"></strong>
            <p class="m-help" x-text="metricHelp(sheet, 'years')"></p>
          </div>
          <div class="metric">
            <span class="m-label" x-text="t('m5Label')"></span>
            <strong class="m-val" x-text="detectText(sheet)"></strong>
            <p class="m-help" x-text="metricHelp(sheet, 'detect')"></p>
          </div>
        </div>

        <div class="takeaway" :class="sheet.significant ? 'sig' : 'unc'">
          <div class="tk-badge">
            <span x-html="icon(sheet.significant ? 'circle-check' : 'circle-help', 16)"></span>
            <span x-text="combinedSummary(sheet).badge"></span>
          </div>
          <p class="tk-lead" x-text="combinedSummary(sheet).lead"></p>
          <p class="tk-official" x-text="sheet.explanation"></p>
        </div>

        <h3 x-text="t('naiveTitle')"></h3>
        <div class="tests">
          <div class="test-row">
            <span x-text="t('naiveRow1')"></span>
            <span class="p" :class="pClass(sheet.stats.naive.p)" x-text="'p = ' + fmtP(sheet.stats.naive.p)"></span>
          </div>
          <div class="test-row">
            <span x-text="t('naiveRow2')"></span>
            <span class="p" :class="pClass(sheet.stats.seasonal_mk_p)" x-text="'p = ' + fmtP(sheet.stats.seasonal_mk_p)"></span>
          </div>
          <div class="test-row">
            <span x-text="t('naiveRow3')"></span>
            <span class="p" :class="pClass(sheet.stats.hamed_rao_p)" x-text="'p = ' + fmtP(sheet.stats.hamed_rao_p)"></span>
          </div>
          <div class="test-row">
            <span x-text="t('naiveRow4')"></span>
            <span class="p" :class="pClass(sheet.stats.ols_corrected.p)" x-text="'p = ' + fmtP(sheet.stats.ols_corrected.p)"></span>
          </div>
        </div>
        <p class="naive-note" x-text="sheet.naive_vs_correct"></p>

        <div class="sheet-foot">
          <button class="btn ghost" @click="downloadCsv(sheet)">
            <span x-html="icon('download', 16)"></span>
            <span x-text="t('downloadCsv')"></span>
          </button>
        </div>
      </div>
    </template>
  </aside>
</body>

</html>
